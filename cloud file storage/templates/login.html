{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-card">

    <h2>Login</h2>

    <form method="post">

        <label>
            Username
        </label>

        <input
            name="username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button
            class="button"
            type="submit">

            Login

        </button>

    </form>

    <p>
        New user?

        <a href="{{ url_for('register') }}">
            Create an account
        </a>
    </p>

</div>

{% endblock %}
