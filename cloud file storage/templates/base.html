<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Secure Cloud Storage
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='style.css') }}">

</head>

<body>

<nav>

    <a class="brand"
       href="{{ url_for('index') }}">
        🔐 SecureCloud
    </a>

    <div>

        {% if session.get('user_id') %}

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        {% else %}

            <a href="{{ url_for('login') }}">
                Login
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

        {% endif %}

    </div>

</nav>

<main class="container">

    {% with messages =
        get_flashed_messages() %}

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
