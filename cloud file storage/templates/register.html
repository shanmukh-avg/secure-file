{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="form-card">

    <h2>Create Account</h2>

    <form method="post">

        <label>
            Username
        </label>

        <input
            name="username"
            required
            maxlength="50"
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
            minlength="6"
        >

        <button
            class="button"
            type="submit">

            Register

        </button>

    </form>

    <p>
        Already registered?

        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>

{% endblock %}
